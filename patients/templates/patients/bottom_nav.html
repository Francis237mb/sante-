<!-- ================= SILICON VALLEY FLOATING CURVED BOTTOM NAVBAR ================= -->
<div class="lg:hidden fixed bottom-4 inset-x-0 mx-auto w-[95%] max-w-[440px] z-50 pointer-events-none select-none font-poppins transition-all duration-300 ease-in-out" id="floating-bottom-navbar">
    <div class="relative w-full h-[74px] pointer-events-auto">
        <!-- SVG Curved Pill Background with Crater Notch -->
        <svg class="absolute inset-0 w-full h-full text-white drop-shadow-[0_12px_35px_rgba(0,0,0,0.16)] drop-shadow-[0_4px_12px_rgba(0,0,0,0.1)] transition-all" viewBox="0 0 400 80" preserveAspectRatio="none">
            <!-- Smooth floating pill capsule with center depression notch -->
            <path d="M 38,0 L 152,0 C 166,0 172,24 185,24 L 215,24 C 228,24 234,0 248,0 L 362,0 C 383,0 400,17 400,38 L 400,42 C 400,63 383,80 362,80 L 38,80 C 17,80 0,63 0,42 L 0,38 C 0,17 17,0 38,0 Z" fill="currentColor"/>
        </svg>

        <!-- Floating Elevated Center Circle Button : ASSISTANT IA AU MILIEU -->
        <a href="{% url 'ia_assistant:chat' %}" id="nav-btn-center" class="absolute -top-6 left-1/2 -translate-x-1/2 w-[62px] h-[62px] rounded-full bg-gradient-to-tr from-slate-950 via-[#0f172a] to-indigo-950 text-white flex flex-col items-center justify-center shadow-[0_12px_30px_rgba(6,182,212,0.45)] border-[3.5px] border-white transition-all duration-300 hover:scale-110 active:scale-95 group z-30 focus:outline-none relative overflow-hidden" title="Assistant IA Médical 24/7">
            <!-- Pulsing AI Aura & Glow -->
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/25 via-blue-500/25 to-purple-500/25 animate-pulse rounded-full pointer-events-none"></div>
            <div class="absolute top-1 right-1.5 w-2 h-2 rounded-full bg-cyan-400 animate-ping"></div>
            <div class="absolute top-1 right-1.5 w-2 h-2 rounded-full bg-cyan-400 border border-slate-900"></div>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-cyan-400 transform group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.187-.813L9 9l.813 5.187L15 15l-5.187.813z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 8l.4 2.6L22 11l-2.6.4L19 14l-.4-2.6L16 11l2.6-.4L19 8z" />
            </svg>
            <span class="text-[9px] font-black tracking-tighter text-white mt-0.5 font-poppins drop-shadow-sm uppercase">IA 24/7</span>
        </a>

        <!-- Navigation Icons Container (Absolute inset-0 ensures alignment exactly inside the white capsule) -->
        <div class="absolute inset-0 z-10 w-full h-full flex items-center justify-around px-2 sm:px-4 pb-2 pt-1">
            <!-- 1. Accueil (Bill style card icon) -->
            <a href="{% url 'patients:dashboard' %}" data-nav="dashboard" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-[#71717a] hover:text-[#18181b] group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg class="w-5 h-5 transition-colors" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span class="active-dot hidden absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-[#18181b]"></span>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Accueil</span>
            </a>

            <!-- 2. Vidéos / List (Briefcase/List style icon) -->
            <a href="{% url 'patients:videos_feed' %}" data-nav="videos" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-[#71717a] hover:text-[#18181b] group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg class="w-5 h-5 transition-colors" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M18 10l-4.97 4.97-1.41-1.41L15.17 10H8V8h7.17l-3.58-3.59L13 3l5 5c.39.39.39 1.02 0 1.41z" opacity="0.3"/>
                        <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM10 8V6H8v2H6v2h2v2h2v-2h2V8h-2z"/>
                        <path d="M10 15l5-3-5-3v6z"/>
                    </svg>
                    <span class="active-dot hidden absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-[#18181b]"></span>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Vidéos</span>
            </a>

            <!-- Center Buffer Space for Assistant IA -->
            <div class="w-16 flex-shrink-0"></div>

            <!-- 3. Mon Suivi / RDV (Calendar Agenda Icon) -->
            <a href="{% url 'patients:suivi' %}" data-nav="suivi" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-[#71717a] hover:text-[#18181b] group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg class="w-5 h-5 transition-colors" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5zm4 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
                    </svg>
                    <span class="active-dot hidden absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-[#18181b]"></span>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Suivi</span>
            </a>

            <!-- 4. Mon Espace / Profil -->
            <a href="{% url 'patients:settings' %}" data-nav="settings" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-[#71717a] hover:text-[#18181b] group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    {% if user.is_authenticated and user.profile_picture %}
                        <img src="{{ user.profile_picture.url }}" class="w-5 h-5 rounded-full object-cover border border-[#71717a]/50 group-hover:border-[#18181b]" alt="Profil">
                    {% else %}
                        <svg class="w-5 h-5 transition-colors" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                    {% endif %}
                    <span class="active-dot hidden absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-[#18181b]"></span>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Profil</span>
            </a>
        </div>

        <!-- iOS Minimalist Home Indicator Grab Bar -->
        <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-[3px] bg-gray-200/90 rounded-full"></div>
    </div>
</div>

<script>
    // Silicon Valley dynamic active state detector & Smart Hide/Show Scroll Animation
    window.addEventListener('DOMContentLoaded', function() {
        try {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('.bottom-nav-item');
            const centerBtn = document.getElementById('nav-btn-center');
            
            if (path.includes('/ia_assistant') || path.includes('/chat')) {
                if (centerBtn) {
                    centerBtn.style.background = 'linear-gradient(135deg, #0891b2, #1e40af, #312e81)';
                    centerBtn.style.transform = 'translate(-50%, -4px) scale(1.08)';
                    centerBtn.style.boxShadow = '0 15px 35px rgba(6, 182, 212, 0.65)';
                }
            } else {
                navItems.forEach(item => {
                    const navType = item.getAttribute('data-nav');
                    let isMatch = false;
                    if (navType === 'dashboard' && (path === '/patients/dashboard/' || path === '/patients/')) isMatch = true;
                    if (navType === 'videos' && path.includes('/videos')) isMatch = true;
                    if (navType === 'suivi' && path.includes('/suivi')) isMatch = true;
                    if (navType === 'settings' && (path.includes('/settings') || path.includes('/pharmacies') || path.includes('/doctor/'))) isMatch = true;

                    if (isMatch) {
                        item.classList.remove('text-[#71717a]');
                        item.classList.add('text-[#18181b]', 'font-black');
                        const dot = item.querySelector('.active-dot');
                        if (dot) dot.classList.remove('hidden');
                        const svg = item.querySelector('svg');
                        if (svg) svg.classList.add('scale-110');
                    }
                });
            }
        } catch (e) {
            console.error('Nav animation state error:', e);
        }
    });
</script>
