<!-- ================= ICONLY FLOATING PILL BOTTOM NAVBAR (PATIENT) ================= -->
<style>
@media (min-width: 1024px) {
    #floating-bottom-navbar-patient { display: none !important; width: 0 !important; height: 0 !important; pointer-events: none !important; overflow: hidden !important; }
}
</style>
<div class="lg:hidden fixed bottom-4 inset-x-0 mx-auto w-[93%] max-w-[430px] z-50 pointer-events-none select-none font-poppins transition-all duration-300 ease-in-out" id="floating-bottom-navbar-patient">
    <div class="relative w-full bg-white/95 backdrop-blur-2xl border border-gray-200/80 rounded-[2.5rem] shadow-[0_15px_45px_rgba(0,0,0,0.12)] py-2 px-3 sm:px-5 pointer-events-auto flex items-center justify-between">
        
        <!-- 1. Accueil -->
        <a href="{% url 'patients:dashboard' %}" data-nav="dashboard" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-leaf-green"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Accueil</span>
        </a>

        <!-- 2. Vidéos -->
        <a href="{% url 'patients:videos_feed' %}" data-nav="videos" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-leaf-green"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Vidéos</span>
        </a>

        <!-- 3. AU MILIEU : Pharmacies & Médicaments -->
        <a href="{% url 'patients:pharmacies' %}" data-nav="pharmacies" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-leaf-green"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Pharmacie</span>
        </a>

        <!-- 4. Suivi / RDV -->
        <a href="{% url 'patients:suivi' %}" data-nav="suivi" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-leaf-green"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Suivi</span>
        </a>

        <!-- 5. Profil / Paramètres -->
        <a href="{% url 'patients:settings' %}" data-nav="settings" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                {% if user.is_authenticated and user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" class="w-5 h-5 rounded-full object-cover border border-gray-300 group-hover:border-leaf-green" alt="Profil">
                {% else %}
                    <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                {% endif %}
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-leaf-green"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Profil</span>
        </a>
    </div>
</div>

<!-- ================= FLOATING IA ASSISTANT BUTTON ================= -->
<a href="{% url 'ia_assistant:chat' %}" class="lg:hidden fixed bottom-24 right-4 w-14 h-14 rounded-full bg-leaf-green text-white flex flex-col items-center justify-center shadow-[0_8px_25px_rgba(109,190,69,0.5)] border-[3px] border-white transform transition-transform duration-300 hover:scale-110 active:scale-90 z-50 focus:outline-none" title="Assistant IA Médical 24/7">
    <div class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white animate-pulse"></div>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.187-.813L9 9l.813 5.187L15 15l-5.187.813z" />
    </svg>
    <span class="text-[8px] font-extrabold tracking-tighter text-white font-poppins uppercase leading-none">IA</span>
</a>

<script>
    // Dynamique d'activation selon le path
    window.addEventListener('DOMContentLoaded', function() {
        try {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('#floating-bottom-navbar-patient .bottom-nav-item');
            
            navItems.forEach(item => {
                const navType = item.getAttribute('data-nav');
                let isMatch = false;
                if (navType === 'dashboard' && (path === '/patients/dashboard/' || path === '/patients/')) isMatch = true;
                if (navType === 'videos' && path.includes('/videos')) isMatch = true;
                if (navType === 'pharmacies' && (path.includes('/pharmacies') || path.includes('/medicaments'))) isMatch = true;
                if (navType === 'suivi' && path.includes('/suivi')) isMatch = true;
                if (navType === 'settings' && (path.includes('/settings') || path.includes('/doctor/'))) isMatch = true;

                if (isMatch) {
                    item.classList.remove('text-gray-400');
                    item.classList.add('text-leaf-green', 'font-black');
                    const dot = item.querySelector('.active-dot');
                    if (dot) dot.classList.remove('hidden');
                }
            });

            // ====== SCRUB/SWIPE TO SWITCH LOGIC ======
            const navContainer = document.querySelector('#floating-bottom-navbar-patient > div');
            let isScrubbing = false;
            let lastHoveredNav = null;

            if (navContainer) {
                navContainer.addEventListener('touchstart', (e) => {
                    isScrubbing = true;
                }, {passive: true});

                navContainer.addEventListener('touchmove', (e) => {
                    if (!isScrubbing) return;
                    e.preventDefault(); // Prevent scrolling while scrubbing
                    const touch = e.touches[0];
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (!el) return;
                    
                    const navItem = el.closest('.bottom-nav-item');
                    if (navItem && navItem !== lastHoveredNav) {
                        if (lastHoveredNav) {
                            lastHoveredNav.classList.remove('bg-gray-100', 'rounded-2xl', 'scale-110');
                        }
                        navItem.classList.add('bg-gray-100', 'rounded-2xl', 'scale-110');
                        lastHoveredNav = navItem;
                        if (navigator.vibrate) navigator.vibrate(15); // Haptic feedback
                    }
                }, {passive: false});

                navContainer.addEventListener('touchend', (e) => {
                    isScrubbing = false;
                    if (lastHoveredNav) {
                        const href = lastHoveredNav.getAttribute('href');
                        if (href && href !== '#') {
                            lastHoveredNav.classList.add('opacity-50');
                            setTimeout(() => { window.location.href = href; }, 50);
                        }
                        setTimeout(() => {
                            if (lastHoveredNav) lastHoveredNav.classList.remove('bg-gray-100', 'rounded-2xl', 'scale-110', 'opacity-50');
                            lastHoveredNav = null;
                        }, 200);
                    }
                });
                
                navContainer.addEventListener('touchcancel', () => {
                    isScrubbing = false;
                    if (lastHoveredNav) lastHoveredNav.classList.remove('bg-gray-100', 'rounded-2xl', 'scale-110');
                    lastHoveredNav = null;
                });
            }
        } catch (e) {
            console.error('Nav error:', e);
        }
    });
</script>
