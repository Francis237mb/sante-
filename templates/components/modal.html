<div x-data="{
        isOpen: false,
        title: '',
        message: '',
        actionUrl: '',
        confirmEvent: '',
        confirmEventDetail: null,
        type: 'info',
        confirmText: 'Confirmer',
        cancelText: 'Annuler',
        
        openModal(e) {
            this.title = e.detail.title || 'Confirmation';
            this.message = e.detail.message || 'Êtes-vous sûr ?';
            this.actionUrl = e.detail.actionUrl || '';
            this.confirmEvent = e.detail.confirmEvent || '';
            this.confirmEventDetail = e.detail.confirmEventDetail || null;
            this.type = e.detail.type || 'info';
            this.confirmText = e.detail.confirmText || 'Confirmer';
            this.cancelText = e.detail.cancelText || 'Annuler';
            this.isOpen = true;
        },
        closeModal() {
            this.isOpen = false;
        },
        handleConfirm() {
            if (this.confirmEvent) {
                this.$dispatch(this.confirmEvent, this.confirmEventDetail);
                this.closeModal();
            } else if (this.actionUrl) {
                this.$refs.form.submit();
            }
        }
    }"
    @open-modal.window="openModal($event)"
    @keydown.escape.window="closeModal()"
    x-cloak
    x-show="isOpen"
    class="fixed inset-0 z-50 flex items-center justify-center overflow-auto bg-slate-900/50 backdrop-blur-sm p-4 transition-opacity"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
>
    <div @click.away="closeModal()" 
         class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative transform transition-all"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
    >
        <button @click="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        
        <div class="flex items-start space-x-4">
            <!-- Icon -->
            <div class="shrink-0 rounded-full p-3 flex items-center justify-center"
                 :class="{
                     'bg-red-100 text-red-600': type === 'danger',
                     'bg-green-100 text-green-600': type === 'success',
                     'bg-blue-100 text-primary': type === 'info'
                 }">
                <svg x-show="type === 'danger'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <svg x-show="type === 'success'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <svg x-show="type === 'info'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            
            <!-- Text Content -->
            <div class="flex-1 mt-1">
                <h3 class="text-xl font-bold text-slate-800 mb-2 font-heading" x-text="title"></h3>
                <p class="text-sm text-slate-500 mb-6" x-text="message"></p>
            </div>
        </div>
        
        <!-- Actions -->
        <div class="flex justify-end space-x-3 mt-2">
            <button type="button" @click="closeModal()" class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors" x-text="cancelText"></button>
            
            <template x-if="actionUrl">
                <form :action="actionUrl" method="post" x-ref="form" class="inline-block">
                    {% csrf_token %}
                    <button type="submit" 
                            class="px-5 py-2.5 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors focus:ring-2 focus:ring-offset-2"
                            :class="{
                                'bg-red-600 hover:bg-red-700 focus:ring-red-500': type === 'danger',
                                'bg-green-600 hover:bg-green-700 focus:ring-green-500': type === 'success',
                                'bg-primary hover:bg-blue-700 focus:ring-primary': type === 'info'
                            }"
                            x-text="confirmText"></button>
                </form>
            </template>
            <template x-if="!actionUrl">
                <button type="button" 
                        @click="handleConfirm()"
                        class="px-5 py-2.5 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors focus:ring-2 focus:ring-offset-2"
                        :class="{
                            'bg-red-600 hover:bg-red-700 focus:ring-red-500': type === 'danger',
                            'bg-green-600 hover:bg-green-700 focus:ring-green-500': type === 'success',
                            'bg-primary hover:bg-blue-700 focus:ring-primary': type === 'info'
                        }"
                        x-text="confirmText"></button>
            </template>
        </div>
    </div>
</div>
