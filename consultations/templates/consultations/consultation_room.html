{% load i18n static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% translate "Appel Vidéo Fransick" %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Jitsi Meet Open Server WebRTC External API -->
    <script src="https://meet.ffmuc.net/external_api.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wa-dark': '#0b141a',
                        'wa-card': '#111b21',
                        'wa-green': '#25D366',
                        'wa-red': '#EA4335',
                        'leaf-green': '#15803d',
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b141a;
        }
        #jitsi-webrtc-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 0;
        }
        #jitsi-webrtc-frame iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
        #native-video-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }
    </style>
</head>
<body class="bg-wa-dark text-white font-inter antialiased relative overflow-hidden select-none">

    <!-- WhatsApp Call Top Header Bar -->
    <header class="absolute top-0 left-0 right-0 z-30 bg-gradient-to-b from-black/90 via-black/50 to-transparent p-4 sm:p-5 flex items-center justify-between pointer-events-auto">
        <div class="flex items-center space-x-3">
            {% if request.user.role == 'medecin' %}
                <a href="{% url 'medecins:dashboard' %}" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white transition-all shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </a>
            {% else %}
                <a href="{% url 'patients:dashboard' %}" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white transition-all shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </a>
            {% endif %}

            <div>
                <h2 class="text-sm sm:text-base font-extrabold font-poppins text-white flex items-center space-x-2">
                    <span>
                        {% if request.user.role == 'medecin' %}
                            {{ rdv.patient.username }}
                        {% else %}
                            Dr. {{ rdv.doctor.username }}
                        {% endif %}
                    </span>
                </h2>
                <div class="flex items-center space-x-2 text-[11px] font-semibold text-emerald-400">
                    <span id="call-timer">00:00</span>
                    <span>•</span>
                    <span class="flex items-center space-x-1">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
                        <span>Consultation En Direct</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full text-[10px] font-extrabold uppercase tracking-wider backdrop-blur-md">
                HD WebRTC
            </span>
        </div>
    </header>

    <!-- Fullscreen Visio Container -->
    <main class="w-full h-full relative">
        <div id="jitsi-webrtc-frame"></div>
        <video id="native-video-fallback" autoplay playsinline muted></video>
    </main>

    <!-- Floating WhatsApp Control Bar (Bottom Center) -->
    <div class="absolute bottom-6 left-0 right-0 z-30 flex items-center justify-center pointer-events-auto px-4">
        <div class="bg-wa-card/95 backdrop-blur-xl border border-white/20 px-6 py-3.5 rounded-full shadow-2xl flex items-center space-x-5">
            
            <!-- Speaker / Sound Toggle -->
            <button type="button" onclick="toggleSpeaker()" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all" title="Haut-parleur">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.287a6 6 0 010 7.427M9.75 9.75l4.5-4.5v13.5l-4.5-4.5H6a1.5 1.5 0 01-1.5-1.5v-3a1.5 1.5 0 011.5-1.5h3.75z" />
                </svg>
            </button>

            <!-- Toggle Mic -->
            <button type="button" id="btn-toggle-mic" onclick="toggleMic()" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all" title="Activer / Muter Micro">
                <svg id="icon-mic" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 1.5a3 3 0 00-3 3v6a3 3 0 006 0v-6a3 3 0 00-3-3z" />
                </svg>
            </button>

            <!-- Toggle Video Cam -->
            <button type="button" id="btn-toggle-cam" onclick="toggleCam()" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition-all" title="Activer / Couper Caméra">
                <svg id="icon-cam" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
            </button>

            <!-- Iconic WhatsApp Red End Call Button -->
            <button type="button" onclick="endCallAjax()" title="Raccrocher et Clôturer" class="w-14 h-14 rounded-full bg-wa-red hover:bg-red-600 active:scale-90 text-white flex items-center justify-center shadow-xl transition-transform cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-7 h-7 transform rotate-[135deg]">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1.003 1.003 0 011.02-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </button>

        </div>
    </div>

    <!-- JAVASCRIPT WEBRTC ENGINE -->
    <script>
        const rdvId = "{{ rdv.id }}";
        const checkStatusUrl = "{% url 'consultations:check_rdv_status' pk=rdv.id %}";
        const endConsultationUrl = "{% url 'consultations:end_consultation' pk=rdv.id %}";
        const isDoctor = "{{ request.user.role }}" === "medecin";
        const displayName = isDoctor ? "Dr. {{ rdv.doctor.username|escapejs }}" : "{{ rdv.patient.username|escapejs }}";

        let callSeconds = 0;
        let isEnding = false;
        let jitsiApi = null;
        let localStream = null;
        let micEnabled = true;
        let camEnabled = true;

        // 1. Minuteur de communication
        function startTimer() {
            setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                const timerEl = document.getElementById('call-timer');
                if (timerEl) timerEl.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        // 2. Initialisation Visio WebRTC sans modérateur (Serveur Open Source meet.ffmuc.net)
        function initJitsiWebRTC() {
            // Utiliser le serveur open source Freifunk München (aucun mot de passe / modérateur requis)
            const domain = "meet.ffmuc.net";
            const roomName = `Fransick_Medical_Room_${rdvId}`;

            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-webrtc-frame'),
                userInfo: {
                    displayName: displayName
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    enableWelcomePage: false,
                    prejoinPageEnabled: false,
                    prejoinConfig: { enabled: false },
                    disableDeepLinking: true,
                    chromeExtensionBanner: false,
                    enableNoAudioDetection: false,
                    enableNoisyMicDetection: false,
                    p2p: { enabled: true }
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    SHOW_BRAND_WATERMARK: false,
                    SHOW_POWERED_BY: false,
                    MOBILE_APP_PROMO: false,
                    HIDE_DEEP_LINKING_LOGO: true,
                    DISPLAY_WELCOME_FOOTER: false,
                    DISPLAY_WELCOME_PAGE_ADDITIONAL_CARD: false,
                    DEFAULT_REMOTE_DISPLAY_NAME: isDoctor ? 'Patient' : 'Dr. Praticien',
                    TOOLBAR_BUTTONS: []
                }
            };

            try {
                if (typeof JitsiMeetExternalAPI !== 'undefined') {
                    jitsiApi = new JitsiMeetExternalAPI(domain, options);

                    setTimeout(() => {
                        const iframe = document.querySelector('#jitsi-webrtc-frame iframe');
                        if (iframe) {
                            iframe.setAttribute('allow', 'camera *; microphone *; display-capture *; autoplay *; fullscreen *');
                            iframe.setAttribute('allowfullscreen', 'true');
                        }
                    }, 300);

                    jitsiApi.addEventListener('readyToClose', endCallAjax);
                    jitsiApi.addEventListener('videoConferenceLeft', endCallAjax);
                } else {
                    startNativeWebRTC();
                }
            } catch (err) {
                console.warn("Jitsi WebRTC non disponible, basculement Native WebRTC :", err);
                startNativeWebRTC();
            }
        }

        // 3. Fallback Caméra Native HTML5 WebRTC
        function startNativeWebRTC() {
            const fallbackVideo = document.getElementById('native-video-fallback');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    if (fallbackVideo) {
                        fallbackVideo.style.display = 'block';
                        fallbackVideo.srcObject = stream;
                    }
                })
                .catch(err => {
                    console.log("Caméra native refusée ou absente :", err);
                });
        }

        function toggleMic() {
            micEnabled = !micEnabled;
            if (jitsiApi) {
                try { jitsiApi.executeCommand('toggleAudio'); } catch(e) {}
            }
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = micEnabled);
            }
            const btn = document.getElementById('btn-toggle-mic');
            if (btn) {
                btn.classList.toggle('bg-wa-red', !micEnabled);
                btn.classList.toggle('bg-white/10', micEnabled);
            }
        }

        function toggleCam() {
            camEnabled = !camEnabled;
            if (jitsiApi) {
                try { jitsiApi.executeCommand('toggleVideo'); } catch(e) {}
            }
            if (localStream) {
                localStream.getVideoTracks().forEach(track => track.enabled = camEnabled);
            }
            const btn = document.getElementById('btn-toggle-cam');
            if (btn) {
                btn.classList.toggle('bg-wa-red', !camEnabled);
                btn.classList.toggle('bg-white/10', camEnabled);
            }
        }

        function toggleSpeaker() {
            alert("🔊 Haut-parleur actif");
        }

        // 4. Action de raccrochage AJAX instantané
        function endCallAjax() {
            if (isEnding) return;
            isEnding = true;

            if (jitsiApi) {
                try { jitsiApi.dispose(); } catch(e) {}
            }
            if (localStream) {
                try { localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
            }

            fetch(endConsultationUrl, {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "X-Requested-With": "XMLHttpRequest",
                    "Content-Type": "application/json"
                }
            })
            .then(res => res.json())
            .then(data => {
                if (isDoctor) {
                    window.location.href = "{% url 'ordonnances:create_for_rdv' rdv_id=rdv.id %}";
                } else {
                    window.location.href = "{% url 'patients:dashboard' %}";
                }
            })
            .catch(err => {
                console.error("Erreur clôture AJAX :", err);
                if (isDoctor) {
                    window.location.href = "{% url 'ordonnances:create_for_rdv' rdv_id=rdv.id %}";
                } else {
                    window.location.href = "{% url 'patients:dashboard' %}";
                }
            });
        }

        // 5. Polling ultra-rapide (1 sec) : Fermeture simultanée chez le correspondant
        function checkConsultationEnd() {
            if (isEnding) return;

            fetch(checkStatusUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'completed') {
                        isEnding = true;
                        if (jitsiApi) {
                            try { jitsiApi.dispose(); } catch(e) {}
                        }
                        if (localStream) {
                            try { localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
                        }
                        if (isDoctor) {
                            window.location.href = "{% url 'ordonnances:create_for_rdv' rdv_id=rdv.id %}";
                        } else {
                            window.location.href = "{% url 'patients:dashboard' %}";
                        }
                    }
                })
                .catch(err => console.error("Erreur sync polling :", err));
        }

        const pollInterval = setInterval(checkConsultationEnd, 1000);

        window.addEventListener('load', () => {
            initJitsiWebRTC();
            startTimer();
        });

        window.addEventListener('beforeunload', () => {
            clearInterval(pollInterval);
            if (jitsiApi) {
                try { jitsiApi.dispose(); } catch(e) {}
            }
            if (localStream) {
                try { localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
            }
        });
    </script>
</body>
</html>
