{% load i18n static %}
<!-- ================= SILICON VALLEY FLOATING CURVED BOTTOM NAVBAR (PRATICIEN) ================= -->
<div class="lg:hidden fixed bottom-4 inset-x-0 mx-auto w-[95%] max-w-[440px] z-50 pointer-events-none select-none font-poppins transition-all duration-300 ease-in-out" id="floating-bottom-navbar">
    <div class="relative w-full h-[74px] pointer-events-auto">
        <!-- SVG Curved Pill Background with Crater Notch -->
        <svg class="absolute inset-0 w-full h-full text-white drop-shadow-[0_12px_35px_rgba(0,0,0,0.16)] drop-shadow-[0_4px_12px_rgba(0,0,0,0.1)] transition-all" viewBox="0 0 400 80" preserveAspectRatio="none">
            <!-- Smooth floating pill capsule with center depression notch -->
            <path d="M 38,0 L 152,0 C 166,0 172,24 185,24 L 215,24 C 228,24 234,0 248,0 L 362,0 C 383,0 400,17 400,38 L 400,42 C 400,63 383,80 362,80 L 38,80 C 17,80 0,63 0,42 L 0,38 C 0,17 17,0 38,0 Z" fill="currentColor"/>
        </svg>

        <!-- Floating Elevated Center Circle Button : ASSISTANT IA AU MILIEU -->
        <a href="{% url 'ia_assistant:chat' %}" id="nav-btn-center" class="absolute -top-6 left-1/2 -translate-x-1/2 w-[62px] h-[62px] rounded-full bg-gradient-to-tr from-slate-950 via-[#0f172a] to-indigo-950 text-white flex flex-col items-center justify-center shadow-[0_12px_30px_rgba(6,182,212,0.45)] border-[3.5px] border-white transition-all duration-300 hover:scale-110 active:scale-95 group z-30 focus:outline-none relative overflow-hidden" title="Assistant IA Médical 24/7">
            <!-- Pulsing AI Aura & Glow -->
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/25 via-blue-500/25 to-purple-500/25 animate-pulse rounded-full pointer-events-none"></div>
            <div class="absolute top-1 right-1.5 w-2 h-2 rounded-full bg-cyan-400 animate-ping"></div>
            <div class="absolute top-1 right-1.5 w-2 h-2 rounded-full bg-cyan-400 border border-slate-900"></div>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-cyan-400 transform group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.187-.813L9 9l.813 5.187L15 15l-5.187.813z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 8l.4 2.6L22 11l-2.6.4L19 14l-.4-2.6L16 11l2.6-.4L19 8z" />
            </svg>
            <span class="text-[9px] font-black tracking-tighter text-white mt-0.5 font-poppins drop-shadow-sm uppercase">IA 24/7</span>
        </a>

        <!-- Navigation Icons Container -->
        <div class="absolute inset-0 z-10 w-full h-full flex items-center justify-around px-2 sm:px-4 pb-2 pt-1">
            <!-- 1. Accueil -->
            <a href="{% url 'medecins:dashboard' %}" class="bottom-nav-item flex flex-col items-center justify-center flex-1 {% if request.path == '/medecins/dashboard/' %}text-medical-blue font-black{% else %}text-[#71717a] hover:text-medical-blue{% endif %} group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Accueil</span>
            </a>

            <!-- 2. Consultations (RDV) -->
            <a href="{% url 'consultations:list' %}" class="bottom-nav-item flex flex-col items-center justify-center flex-1 {% if request.path == '/consultations/list/' %}text-medical-blue font-black{% else %}text-[#71717a] hover:text-medical-blue{% endif %} group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Consult.</span>
            </a>

            <!-- Center Buffer Space for Assistant IA -->
            <div class="w-16 flex-shrink-0"></div>

            <!-- 3. Patients & Dossiers -->
            <a href="{% url 'medecins:patients' %}" class="bottom-nav-item flex flex-col items-center justify-center flex-1 {% if request.path == '/medecins/patients/' %}text-medical-blue font-black{% else %}text-[#71717a] hover:text-medical-blue{% endif %} group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6 0 3.375 3.375 0 0 1 6 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Patients</span>
            </a>

            <!-- 4. Paramètres -->
            <a href="{% url 'medecins:settings' %}" class="bottom-nav-item flex flex-col items-center justify-center flex-1 {% if request.path == '/medecins/settings/' %}text-medical-blue font-black{% else %}text-[#71717a] hover:text-medical-blue{% endif %} group transition-all duration-200 focus:outline-none">
                <div class="w-7 h-7 rounded-xl flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </div>
                <span class="text-[10px] font-bold mt-0.5 transition-colors truncate max-w-[55px]">Param.</span>
            </a>
        </div>
    </div>
</div>
<form action="{% url 'accounts:logout' %}" method="post" id="mobile-logout-form" class="hidden">{% csrf_token %}</form>
