{% load i18n static %}
<!-- ================= ICONLY FLOATING PILL BOTTOM NAVBAR (PRATICIEN) ================= -->
<style>
@media (min-width: 1024px) {
    #floating-bottom-navbar-doctor { display: none !important; width: 0 !important; height: 0 !important; pointer-events: none !important; overflow: hidden !important; }
}
</style>
<div class="lg:hidden fixed bottom-4 inset-x-0 mx-auto w-[93%] max-w-[430px] z-50 pointer-events-none select-none font-poppins transition-all duration-300 ease-in-out" id="floating-bottom-navbar-doctor">
    <div class="relative w-full bg-white/95 backdrop-blur-2xl border border-gray-200/80 rounded-[2.5rem] shadow-[0_15px_45px_rgba(0,0,0,0.12)] py-2 px-3 sm:px-5 pointer-events-auto flex items-center justify-between">
        
        <!-- 1. Accueil -->
        <a href="{% url 'medecins:dashboard' %}" data-nav="dashboard" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-medical-blue"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Accueil</span>
        </a>

        <!-- 2. Consultations (RDV) -->
        <a href="{% url 'consultations:list' %}" data-nav="consult" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-medical-blue"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Consult.</span>
        </a>

        <!-- 3. AU MILIEU : BOUTON CIRCULAIRE FLOATER VERT (Iconly Style) -->
        <a href="{% url 'ia_assistant:chat' %}" id="nav-btn-center-doc" class="flex-shrink-0 w-[54px] h-[54px] rounded-full bg-medical-blue text-white flex flex-col items-center justify-center shadow-[0_8px_22px_rgba(109,190,69,0.45)] border-[3.5px] border-white -translate-y-3.5 transform transition-transform duration-300 hover:scale-105 active:scale-95 group z-30 focus:outline-none relative" title="Assistant IA Médical 24/7">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white transform group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.187-.813L9 9l.813 5.187L15 15l-5.187.813z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 8l.4 2.6L22 11l-2.6.4L19 14l-.4-2.6L16 11l2.6-.4L19 8z" />
            </svg>
            <span class="text-[8px] font-extrabold tracking-tighter text-white mt-0.5 font-poppins uppercase leading-none">IA 24/7</span>
        </a>

        <!-- 4. Patients & Dossiers -->
        <a href="{% url 'medecins:patients' %}" data-nav="patients" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6 0 3.375 3.375 0 0 1 6 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-medical-blue"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Patients</span>
        </a>

        <!-- 5. Paramètres -->
        <a href="{% url 'medecins:settings' %}" data-nav="settings" class="bottom-nav-item flex flex-col items-center justify-center flex-1 text-gray-400 hover:text-gray-900 group transition-all duration-200 focus:outline-none">
            <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 group-active:scale-90 transition-transform duration-200 relative">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <span class="active-dot hidden absolute -bottom-1.5 w-1.5 h-1.5 rounded-full bg-medical-blue"></span>
            </div>
            <span class="text-[10px] font-bold mt-1 transition-colors truncate max-w-[55px]">Param.</span>
        </a>
    </div>
</div>
<form action="{% url 'accounts:logout' %}" method="post" id="mobile-logout-form" class="hidden">{% csrf_token %}</form>

<script>
    // Dynamique d'activation selon le path (Praticien)
    window.addEventListener('DOMContentLoaded', function() {
        try {
            const path = window.location.pathname;
            const navItems = document.querySelectorAll('#floating-bottom-navbar-doctor .bottom-nav-item');
            const centerBtn = document.getElementById('nav-btn-center-doc');
            
            if (path.includes('/ia_assistant') || path.includes('/chat')) {
                if (centerBtn) {
                    centerBtn.classList.add('scale-105', 'ring-4', 'ring-medical-blue/20');
                }
            } else {
                navItems.forEach(item => {
                    const navType = item.getAttribute('data-nav');
                    let isMatch = false;
                    if (navType === 'dashboard' && (path === '/medecins/dashboard/' || path === '/medecins/')) isMatch = true;
                    if (navType === 'consult' && path.includes('/consultations')) isMatch = true;
                    if (navType === 'patients' && path.includes('/patients_list') || (navType === 'patients' && path === '/medecins/patients/')) isMatch = true;
                    if (navType === 'settings' && path.includes('/settings')) isMatch = true;

                    if (isMatch) {
                        item.classList.remove('text-gray-400');
                        item.classList.add('text-medical-blue', 'font-black');
                        const dot = item.querySelector('.active-dot');
                        if (dot) dot.classList.remove('hidden');
                    }
                });
            }
        } catch (e) {
            console.error('Doc Nav error:', e);
        }
    });
</script>
